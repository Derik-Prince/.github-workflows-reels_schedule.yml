name: Generate and publish deal reels

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Language'
        required: true
        default: 'te'
        type: choice
        options:
          - te
          - hi
          - en
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST Telugu
    - cron: '30 7 * * *'   # 13:00 IST Hindi
    - cron: '30 11 * * *'  # 17:00 IST English

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          pip install -r requirements.txt || pip install requests edge-tts beautifulsoup4 pillow python-dotenv

      - name: Select Scheduled Language
        id: lang
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lang=${{ inputs.language }}" >> "$GITHUB_OUTPUT"
          else
            H=$(date -u +%H)
            if [ "$H" = "01" ]; then echo "lang=te" >> "$GITHUB_OUTPUT";
            elif [ "$H" = "07" ]; then echo "lang=hi" >> "$GITHUB_OUTPUT";
            else echo "lang=en" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Setup Config and Fix Relative Imports
        shell: bash
        run: |
          mkdir -p config
          if [ -f "products.json" ]; then
            cp products.json config/products.json
          fi
          sed -i 's/from \./from /g' *.py

      - name: Generate Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python main.py --language "${{ steps.lang.outputs.lang }}"

      - name: Upload Video to GitHub Release CDN & Publish to Instagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: "v21.0"
          PUBLISH_INSTAGRAM: "true"
        run: |
          VIDEO_PATH=$(ls public/reels/*.mp4 | head -n 1)
          VIDEO_NAME=$(basename "$VIDEO_PATH")
          echo "Found video: $VIDEO_PATH ($VIDEO_NAME)"

          # Refresh GitHub Release CDN
          gh release delete v1.0-cache -y || true
          git tag -d v1.0-cache || true
          git push origin :refs/tags/v1.0-cache || true
          gh release create v1.0-cache "$VIDEO_PATH" --title "Reel CDN" --notes "Auto Reel Asset"

          # Wait for GitHub CDN to sync globally
          sleep 12

          REPO_NAME="${{ github.repository }}"
          DIRECT_URL="https://github.com/${REPO_NAME}/releases/download/v1.0-cache/${VIDEO_NAME}"
          echo "Direct CDN URL: $DIRECT_URL"

          python -c "
          import os, json
          from utils import safe, PUBLIC
          from instagram import publish
          from deal_engine import select

          lang = '${{ steps.lang.outputs.lang }}'
          product = select(lang)
          work = PUBLIC / 'cache' / safe(product['id'] + '_' + lang)
          plan = json.loads((work / 'plan.json').read_text(encoding='utf-8'))
          caption = f\"{plan['hook']}\n\n🔥 {product['currency']}{product['current_price']:,} | {product.get('discount_percent',0)}% OFF\n\nComment {product['keyword']} for link.\n\n#deals #offers #shopping #reels\"

          res = publish('$DIRECT_URL', caption)
          print('Publish Response:', res)
          "

      - name: Upload Generated Reel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.lang.outputs.lang }}-${{ github.run_id }}
          path: public/reels/*.mp4
          retention-days: 2
