name: Scheduled Reels Auto Poster

on:
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Language to render (te, hi, en)'
        required: true
        default: 'te'
  schedule:
    # 7:00 AM IST -> 1:30 AM UTC (Telugu)
    - cron: '30 1 * * *'
    # 1:00 PM IST -> 7:30 AM UTC (Hindi)
    - cron: '30 7 * * *'
    # 5:00 PM IST -> 11:30 AM UTC (English)
    - cron: '30 11 * * *'

permissions:
  contents: write

jobs:
  render_and_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-poppins fonts-telu imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          pip install requests edge-tts moviepy pillow beautifulsoup4

      - name: Render Reel and Audio
        id: render
        env:
          TARGET_LANG: ${{ github.event.inputs.target_lang }}
        run: |
          python render_ae_reel.py --render-only

      - name: Upload Video to Temporary Public URL
        id: upload_video
        run: |
          LANG=$(cat current_lang.txt)
          VIDEO_FILE="reel_${LANG}.mp4"
          DOWNLOAD_URL=$(curl --upload-file ./${VIDEO_FILE} https://transfer.sh/${VIDEO_FILE})
          echo "PUBLIC_URL=${DOWNLOAD_URL}" >> $GITHUB_ENV
          echo "Public Video Link: ${DOWNLOAD_URL}"

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          python render_ae_reel.py --publish-only
