name: Scheduled Reels Auto Poster & DM Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  run_automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq fonts-dejavu-core
          pip install requests edge-tts beautifulsoup4 pillow

      - name: Auto-Discover and Select Trending Deal
        run: |
          python auto_deal_engine.py

      - name: Render Google-Style Reel and Audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python render_ae_reel.py --render-only

      - name: Upload Video to GitHub Release CDN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO_FILE="out/reel_te.mp4"
          gh release delete v1.0-cache -y || true
          git tag -d v1.0-cache || true
          git push origin :refs/tags/v1.0-cache || true
          gh release create v1.0-cache "$VIDEO_FILE" --title "Reel Cache" --notes "Auto Reel Asset"
          REPO_NAME="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO_NAME}/releases/download/v1.0-cache/reel_te.mp4"
          echo "PUBLIC_URL=${DOWNLOAD_URL}" >> $GITHUB_ENV

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          python render_ae_reel.py --publish-only

      - name: Check Comments and Send DMs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python auto_dm_reply.py

      - name: Auto-Commit State Rotation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add current_deal_index.txt processed_comments.txt active_deal.json || true
          git commit -m "Auto-Engine State Update [skip ci]" || true
          git push || true
