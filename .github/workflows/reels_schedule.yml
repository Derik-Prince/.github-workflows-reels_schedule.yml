name: Scheduled Reels Auto Poster & DM Bot

on:
  workflow_dispatch:
    inputs:
      target_lang:
        description: 'Language (te, hi, en)'
        required: true
        default: 'te'
  schedule:
    # 7:00 AM IST (Telugu Reel)
    - cron: '30 1 * * *'
    # 1:00 PM IST (Hindi Reel)
    - cron: '30 7 * * *'
    # 5:00 PM IST (English Reel)
    - cron: '30 11 * * *'
    # Hourly DM Comment Trigger
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  run_automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick curl jq
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-7/policy.xml || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          pip install "moviepy<2.0.0" requests edge-tts pillow==9.5.0 beautifulsoup4 openai-whisper elevenlabs

      - name: Auto-Discover and Select Trending Deal
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 11 * * *'
        run: |
          python auto_deal_engine.py

      - name: Render Reel and Audio
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 11 * * *'
        env:
          TARGET_LANG: ${{ github.event.inputs.target_lang }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python render_ae_reel.py --render-only

      - name: Upload Video to GitHub Release CDN
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 11 * * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LANG=$(cat current_lang.txt)
          VIDEO_FILE="reel_${LANG}.mp4"
          gh release delete v1.0-cache -y || true
          git tag -d v1.0-cache || true
          git push origin :refs/tags/v1.0-cache || true
          gh release create v1.0-cache "$VIDEO_FILE" --title "Reel Cache" --notes "Auto Reel Asset"
          REPO_NAME="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO_NAME}/releases/download/v1.0-cache/${VIDEO_FILE}"
          echo "PUBLIC_URL=${DOWNLOAD_URL}" >> $GITHUB_ENV

      - name: Publish Reel to Instagram
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 11 * * *'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          python render_ae_reel.py --publish-only

      - name: Check Comments and Send DMs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python auto_dm_reply.py

      - name: Auto-Commit State Rotation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add current_deal_index.txt processed_comments.txt active_deal.json || true
          git commit -m "Auto-Engine State Update [skip ci]" || true
          git push || true
